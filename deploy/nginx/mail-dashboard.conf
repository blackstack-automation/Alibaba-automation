# Install:
#   sudo cp deploy/nginx/mail-dashboard.conf /etc/nginx/sites-available/mail-dashboard
#   sudo sed -i 's/YOUR_DOMAIN/dashboard.example.com/' /etc/nginx/sites-available/mail-dashboard
#   sudo ln -s /etc/nginx/sites-available/mail-dashboard /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dashboard.example.com     # adds HTTPS + redirect

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # CSV/XLSX recipient uploads
    client_max_body_size 20m;

    # Live job status (Server-Sent Events). Without buffering off, nginx holds the
    # stream back and the counters on the job page never update.
    location ~ ^/jobs/[0-9]+/status$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
