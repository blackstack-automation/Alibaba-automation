<div
    x-data="{ open: false, message: '', pendingForm: null }"
    x-on:open-confirm-modal.window="open = true; message = $event.detail.message; pendingForm = $event.detail.form"
    x-show="open"
    x-cloak
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/40"
    style="display: none;"
>
    <div class="bg-white rounded-lg shadow-lg max-w-sm w-full p-6" x-on:click.outside="open = false">
        <p class="text-sm text-gray-800 mb-6" x-text="message"></p>
        <div class="flex justify-end gap-3">
            <button
                type="button"
                class="px-4 py-2 text-sm rounded border hover:bg-gray-50"
                x-on:click="open = false"
            >Cancel</button>
            <button
                type="button"
                class="px-4 py-2 text-sm rounded bg-red-600 text-white hover:bg-red-700"
                x-on:click="open = false; pendingForm.submit()"
            >Confirm</button>
        </div>
    </div>
</div>
